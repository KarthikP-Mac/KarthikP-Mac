name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run on push to main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # personal access token with "repo" scope (needed for private stats)
          # Fallback to default GITHUB_TOKEN if METRICS_TOKEN is not configured
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          # Options
          user: KarthikP-Mac
          template: classic
          base: header, activity, community, repositories
          
          # Languages plugin configuration
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          
          # Output file name
          filename: github-metrics.svg
